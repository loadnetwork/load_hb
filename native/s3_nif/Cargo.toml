[package]
name = "s3_nif"
version = "0.4.1"
edition = "2024"

[lib]
name = "s3_nif"
crate-type = ["cdylib", "rlib"]


[dependencies]
bundles_rs = { git = "https://github.com/loadnetwork/bundles-rs.git", branch = "main"}
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-smithy-types = "1.0"
aws-sdk-s3 = "1.96.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8.4"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hyper = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
lru = "0.12"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
rustler = "0.29.1"
futures = "0.3.31"
byteorder = "1.5.0"
anyhow = "1.0.99"
infer = "0.19.0"
dotenvy = "0.15.7"
chrono = "0.4.42"
jsonwebtoken = "9.3.1"
x402-rs = { version = "0.7.9" }
x402-axum = { version = "0.3.1", features = ["telemetry"] }
base64 = "0.22"


[[bin]]
name = "sidecar"
path = "src/bin/sidecar.rs"
